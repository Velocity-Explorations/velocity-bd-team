# Relevance filter for APFIT's cycle-status posts (PRO-547). There are two cycles a year and every
# post names APFIT, so the broad keyword keeps them all and the judges rate each: APFIT funds
# production for small business and nontraditional performers, through a government sponsor.
# The tight keywords and blocklist are the other portals'. Matching is plain substring on
# lowercased title + description. Blocklist entries are regular expressions, matched
# case-insensitively. An approved keyword change on the dashboard edits this file and filters the
# portal's stored calls again.

broad_keywords:
  - apfit

tight_keywords:
  - artificial intelligence
  - machine learning
  - autonomous systems
  - command and control
  - computer vision
  - natural language processing
  - cobol modernization
  - legacy modernization
  - transcription
  - translation
  - sensor fusion
  - c5isr
  - software defined
  - ai hardware
  - edge ai
  - autonomous vehicle
  - multi-agent

blocklist_patterns:
  - '\brepair\b'
  - '\bspare parts\b'
  - '\bparts kit\b'
  - '\bnsn\s+\d'
  - '\b\d{4}-\d{2,}-\d{2,}-\d{2,}\b'
  - '\bhose assembly\b'
  - '\bcircuit card\b'
  - '\bconstruction\b.*\b(facility|building|pavement|airfield|runway)\b'
  - '\bdocument destruction\b'
  - '\bmedical cart\b'
  - '\bboiler replacement\b'
  - '\bfuel supplier\b'
  - '\bdredging\b'
  - '\bappraisal service\b'
  - '\bplc training\b'
