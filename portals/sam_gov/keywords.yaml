# Relevance filter for SAM.gov notices (PRO-525). Started on 2026-10-22 from the SSC Front Door
# lists, which are Vulcan SOF's without the industry day and conference blocklist entries: special
# notices often announce industry days, and the judges rate them on topic. Matching is plain
# substring on lowercased title + description. Blocklist entries are regular expressions, matched
# case-insensitively; a blocklisted title is dropped before its description is read. An approved
# keyword change on the dashboard edits this file and filters the portal's stored calls again.

