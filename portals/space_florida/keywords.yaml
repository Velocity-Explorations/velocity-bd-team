# Relevance filter for Space Florida's RFPs (PRO-546). Space Florida gives a title and document names
# only, so this is the other portals' list without the bare "ai", which matches words like
# "maintenance" and "repair" in facility titles, plus computer, technology and saas. The blocklist
# drops construction, repair and parts work (its boiler and fuel supplier entries came from Space
# Florida's own past RFPs). Matching is plain substring on lowercased title + description. Blocklist
# entries are regular expressions, matched case-insensitively. An approved keyword change on the
# dashboard edits this file and filters the portal's stored calls again.

broad_keywords:
  - artificial intelligence
  - machine learning
  - software
  - data
  - cyber
  - cloud
  - modernization
  - command and control
  - c2
  - nlp
  - autonomous
  - autonomy
  - digital
  - information
  - analytics
  - agentic
  - esof
  - engage sof
  - warfighter
  - joint
  - experimentation
  - computing
  - algorithm
  - automation
  - intelligence
  - help desk
  - privacy
  - opsec
  - c5isr
  - isr
  - sensor
  - network
  - communications
  - pcte
  - training system
  - simulation
  - cryptograph
  - zero trust
  - analysis
  - optimization
  - computer
  - technology
  - saas

tight_keywords:
  - artificial intelligence
  - machine learning
  - autonomous systems
  - command and control
  - computer vision
  - natural language processing
  - cobol modernization
  - legacy modernization
  - transcription
  - translation
  - sensor fusion
  - c5isr
  - software defined
  - ai hardware
  - edge ai
  - autonomous vehicle
  - multi-agent

blocklist_patterns:
  - '\brepair\b'
  - '\bspare parts\b'
  - '\bparts kit\b'
  - '\bnsn\s+\d'
  - '\b\d{4}-\d{2,}-\d{2,}-\d{2,}\b'
  - '\bhose assembly\b'
  - '\bcircuit card\b'
  - '\bconstruction\b.*\b(facility|building|pavement|airfield|runway)\b'
  - '\bdocument destruction\b'
  - '\bmedical cart\b'
  - '\bboiler replacement\b'
  - '\bfuel supplier\b'
  - '\bdredging\b'
  - '\bappraisal service\b'
  - '\bplc training\b'
