blocklist_patterns:
  - '\brepair\b'
  - '\bspare parts\b'
  - '\bparts kit\b'
  - '\bnsn\s+\d'
  - '\b\d{4}-\d{2,}-\d{2,}-\d{2,}\b'
  - '\bhose assembly\b'
  - '\bcircuit card\b'
  - '\bconstruction\b.*\b(facility|building|pavement|airfield|runway)\b'
  - '\bdocument destruction\b'
  - '\bmedical cart\b'
  - '\bboiler replacement\b'
  - '\bfuel supplier\b'
  - '\bdredging\b'
  - '\bappraisal service\b'
  - '\bplc training\b'
