# Relevance filter for BidNet Direct's Colorado and Florida bids (PRO-544). BidNet shows titles only,
# so this is the other portals' list without the bare "ai", which matches words like "maintenance"
# and "repair" in state and local titles, plus computer, technology and saas. The blocklist drops
# construction, repair and parts bids before the judges see them. Matching is plain substring on
# lowercased title + description (the description is the same generic sentence for every bid).
# Blocklist entries are regular expressions, matched case-insensitively. An approved keyword change
# on the dashboard edits this file and filters the portal's stored calls again.

broad_keywords:
  - artificial intelligence
  - machine learning
  - software
  - data
  - cyber
  - cloud
  - modernization
  - command and control
  - c2
  - nlp
  - autonomous
  - autonomy
  - digital
  - information
  - analytics
  - agentic
  - esof
  - engage sof
  - warfighter
  - joint
  - experimentation
  - computing
  - algorithm
  - automation
  - intelligence
  - help desk
  - privacy
  - opsec
  - c5isr
  - isr
  - sensor
  - network
  - communications
  - pcte
  - training system
  - simulation
  - cryptograph
  - zero trust
