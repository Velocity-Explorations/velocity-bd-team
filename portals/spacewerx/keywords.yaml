# Relevance filter for SpaceWERX's listings (PRO-538). SpaceWERX lists solicitations, not their
# topics, so the broad keywords keep every SBIR or STTR cycle and every STRATFI or TACFI notice,
# and the judges rate it; STRATFI and TACFI are only for companies with a current or recent
# Phase II award, which each card says. The tight keywords and blocklist are the other portals',
# so a listing whose title names a topic ranks tight. Matching is plain substring on lowercased
# title + description. Blocklist entries are regular expressions, matched case-insensitively. An
# approved keyword change on the dashboard edits this file and filters the portal's stored calls
# again.

broad_keywords:
  - sbir
  - sttr
  - stratfi
  - tacfi

tight_keywords:
  - artificial intelligence
  - machine learning
  - autonomous systems
  - command and control
  - computer vision
  - natural language processing
  - cobol modernization
  - legacy modernization
  - transcription
  - translation
  - sensor fusion
  - c5isr
  - software defined
  - ai hardware
  - edge ai
  - autonomous vehicle
  - multi-agent

blocklist_patterns:
  - '\brepair\b'
  - '\bspare parts\b'
  - '\bparts kit\b'
  - '\bnsn\s+\d'
  - '\b\d{4}-\d{2,}-\d{2,}-\d{2,}\b'
  - '\bhose assembly\b'
  - '\bcircuit card\b'
  - '\bconstruction\b.*\b(facility|building|pavement|airfield|runway)\b'
  - '\bdocument destruction\b'
  - '\bmedical cart\b'
  - '\bboiler replacement\b'
  - '\bfuel supplier\b'
  - '\bdredging\b'
  - '\bappraisal service\b'
  - '\bplc training\b'
