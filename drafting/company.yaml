# The fields the drafting prompts and templates fill ({company_name}, {cage} and so on). Velocity's facts are not
# kept in this repo, which is public: they live in 01 Company Reference on Drive and are edited there (README.md), and
# every Writer step reads them fresh (drafting/facts.py). So each field names the fact in 00 Company Facts that holds
# its value, and the Writer fills it from the facts it is given. A field no fact holds is left as [NEEDS FACT: ...].
company_name: "Velocity Explorations"
short_name: "Velocity Explorations"
legal_name: "[F-01: legal name]"
uei: "[F-02: UEI]"
cage: "[F-03: CAGE]"
duns: "[F-04: DUNS]"
naics_display: "[F-05: NAICS]"
business_size: "[F-06: size and status]"
company_description: "[F-17: what the company does]"
poc_name: "[F-21: the President's name]"
poc_title: "[F-21: the President's title]"
poc_email: "[NEEDS FACT: the point of contact's email]"
poc_phone: "[NEEDS FACT: the point of contact's phone]"
