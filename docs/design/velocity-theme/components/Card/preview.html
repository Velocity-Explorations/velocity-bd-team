<!-- @dsCard group="Cards" height=220 width=1920 subtitle="Default, list, recessed, row, compact" -->
<!doctype html>
<html lang="en" data-theme="dark">
<head>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../bundle.css"><meta charset="utf-8"><title>Card preview</title></head>
<body>
<div class="vx-canvas vx-grid">
  <div class="vx-stack">
    <div class="vx-card">
      <p class="vx-label vx-accent">Technical lead</p>
      <p class="vx-heading">BD Team</p>
      <p class="vx-body vx-ink-secondary">Scans, reviews and proposal drafts</p>
    </div>
    <div class="vx-card vx-card--row"><p class="vx-body">Weekly scan</p><p class="vx-meta">Sundays, 22:00</p></div>
    <div class="vx-card vx-card--row"><p class="vx-body">Monday brief</p><p class="vx-meta">Mondays, 09:00</p></div>
  </div>
  <div class="vx-stack">
    <div class="vx-card vx-card--list vx-card--recessed">
      <p class="vx-label">Out of scope</p>
      <ul class="vx-bullets vx-bullets--muted vx-body vx-ink-secondary">
        <li>Portals that block automated reading</li>
        <li>Login-gated pages in the public repo</li>
        <li>Decisions made in Slack</li>
      </ul>
    </div>
    <div class="vx-card vx-card--compact">
      <p class="vx-label-plain vx-accent">Run summary</p>
      <p class="vx-small vx-ink-secondary">Posted to Slack after each run</p>
    </div>
  </div>
</div>
</body>
</html>
